[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proteinlens"
version = "0.3.0"
description = "Interactive representation-learning platform for exploring the learned geometry of protein sequence space"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sunkalp Chandra" }]
dependencies = [
    "torch>=2.2",
    "transformers>=4.40",
    "biopython>=1.83",
    "numpy>=1.26,<3",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "faiss-cpu>=1.7.4",
    "umap-learn>=0.5.5",
    "fastapi>=0.110",
    "pydantic>=2.6",
    "uvicorn[standard]>=0.29",
    "requests>=2.31",
    "tqdm>=4.66",
    "pyarrow>=15.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.4",
]

[tool.setuptools]
packages = ["models", "ml", "api"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
# E501: long lines allowed (data-heavy code); B008: FastAPI Depends/Query in
# argument defaults is the framework's dependency-injection idiom.
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
